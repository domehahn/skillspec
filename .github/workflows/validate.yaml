name: Validate

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  validate-json:
    name: JSON schemas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JSON is well-formed
        run: |
          python3 -c "
          import json, sys, pathlib
          schemas = list(pathlib.Path('schemas').glob('*.schema.json'))
          if not schemas:
              print('No schemas found', file=sys.stderr)
              sys.exit(1)
          for f in schemas:
              json.loads(f.read_text())
              print(f'OK  {f}')
          "

  validate-openapi:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install vacuum
        run: |
          curl -fsSL https://quobix.com/scripts/install_vacuum.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Lint OpenAPI document
        run: vacuum lint openapi/registry-api-v1.openapi.yaml

  validate-examples:
    name: Example files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Validate YAML syntax
        run: |
          python3 -c "
          import yaml, pathlib, sys
          files = [
              'examples/skill.yaml',
              'examples/agent-skills.yaml',
              'examples/agent-skills.lock.yaml',
              'examples/package/skill.yaml',
          ]
          for f in files:
              yaml.safe_load(pathlib.Path(f).read_text())
              print(f'OK  {f}')
          "

      - name: Validate examples against schemas
        run: |
          python3 - <<'EOF'
          import json, yaml, pathlib, sys
          import jsonschema

          def load_yaml(path):
              return yaml.safe_load(pathlib.Path(path).read_text())

          def load_schema(path):
              return json.loads(pathlib.Path(path).read_text())

          cases = [
              ('examples/skill.yaml',              'schemas/skill.schema.json'),
              ('examples/package/skill.yaml',       'schemas/skill.schema.json'),
              ('examples/agent-skills.yaml',        'schemas/agent-skills.schema.json'),
              ('examples/agent-skills.lock.yaml',   'schemas/agent-skills-lock.schema.json'),
          ]

          errors = []
          for data_path, schema_path in cases:
              data   = load_yaml(data_path)
              schema = load_schema(schema_path)
              try:
                  jsonschema.validate(data, schema)
                  print(f'OK  {data_path}')
              except jsonschema.ValidationError as e:
                  errors.append(f'FAIL  {data_path}: {e.message}')
                  print(f'FAIL  {data_path}: {e.message}', file=sys.stderr)

          if errors:
              sys.exit(1)
          EOF

  validate-makefile:
    name: Makefile validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pyyaml
        run: pip install pyyaml

      - name: Run make validate-schemas and validate-yaml
        run: make validate-schemas validate-yaml
